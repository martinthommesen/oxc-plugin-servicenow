# Publish the exact inspected tarball with npm trusted publishing (OIDC).
# Requires a protected GitHub Environment named `release`.
# The publish job is the only job with id-token: write; trusted publishing uses OIDC only.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run workflow:check
      - run: npm run compat:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run docs:check
      - run: npm run manifest:check
      - run: npm run bench
      - id: meta
        name: Verify tag, ancestry, and changelog heading
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test "v${version}" = "$GITHUB_REF_NAME"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/check-release-artifact.mjs --changelog-only
      - id: pack
        name: Build and inspect one tarball
        run: |
          node scripts/check-release-artifact.mjs --write-path "$RUNNER_TEMP/release-tarball-path"
          tarball="$(cat "$RUNNER_TEMP/release-tarball-path")"
          echo "tarball=$(basename "$tarball")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  # Every declared compatibility cell runs in the Node runtime it names. The
  # matrix is required by the publish job, so no cell can be silently skipped.
  consumer:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: min-hosts
            node: 20.19.0
          - cell: node20-floor
            node: "20"
          - cell: node22-lts
            node: "22"
          - cell: node24-lts
            node: "24"
          - cell: node26-current
            node: "26"
          - cell: eslint9-current
            node: current
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: .
      - run: npm ci
      - name: Install and test the exact tarball
        run: npx tsx scripts/compat-consumer.mjs --cell "${{ matrix.cell }}" --tarball "./${{ needs.validate.outputs.tarball }}"

  # This job is deliberately artifact-only. It has no checkout and no install;
  # all repository-controlled validation completed in read-only jobs above.
  publish:
    needs: [validate, consumer]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.5.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: .
      - name: Verify executable npm for trusted publishing
        env:
          TRUSTED_PUBLISHING_NPM_VERSION: 11.5.1
        run: |
          actual="$(npm --version)"
          node --input-type=module -e '
            const [actual, expected] = process.argv.slice(1);
            if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(actual) || actual !== expected) {
              console.error(`trusted publishing requires npm ${expected}; executable npm reported ${actual}`);
              process.exit(1);
            }
          ' "$actual" "$TRUSTED_PUBLISHING_NPM_VERSION"
      - id: publish
        name: Publish the inspected tarball (ambiguous failures are verified below)
        continue-on-error: true
        run: npm publish "./${{ needs.validate.outputs.tarball }}" --ignore-scripts --provenance --access public

  # Registry verification is intentionally outside the OIDC job. If npm
  # accepted a publish but returned an ambiguous error (or the version already
  # existed), this job compares integrity/provenance and safely continues only
  # when the registry bytes are identical.
  registry-verify:
    if: ${{ always() && needs.validate.result == 'success' && needs.consumer.result == 'success' && needs.publish.result != 'cancelled' }}
    needs: [validate, consumer, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: .
      - name: Verify registry integrity, provenance, exports, and declarations
        run: node scripts/verify-published-package.mjs --tarball "./${{ needs.validate.outputs.tarball }}"

  # GitHub release creation is isolated from both OIDC and registry install /
  # import verification. The helper is idempotent and compares an existing
  # asset before accepting a retry.
  github-release:
    if: ${{ needs.registry-verify.result == 'success' }}
    needs: [validate, registry-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: .
      - name: Create or verify the GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/create-github-release.mjs --tag "$GITHUB_REF_NAME" --version "${{ needs.validate.outputs.version }}" --tarball "./${{ needs.validate.outputs.tarball }}"
