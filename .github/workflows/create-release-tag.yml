name: Create release tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
      - id: release-sentinel
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_SENTINEL_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_SENTINEL_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: oxc-plugin-servicenow
          permission-contents: write
      - name: Create verified release tag
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_SENTINEL_TOKEN: ${{ steps.release-sentinel.outputs.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/create-release-tag.mjs
