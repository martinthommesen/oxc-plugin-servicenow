name: Governance audit

on:
  workflow_dispatch:
  schedule:
    # Nightly, offset from the CI cron: the audited state is mutable GitHub
    # configuration that can drift without any repository event, so drift
    # detection cannot rely on a human trigger (FINDINGS.md OPS-008). The
    # job stays out of the required status checks so a transient API
    # failure cannot block merges.
    - cron: "47 4 * * *"

permissions:
  contents: read

jobs:
  audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run workflow:check
      - name: Compare read-only live governance with the desired policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-governance.mjs
