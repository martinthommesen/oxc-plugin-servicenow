name: Recover GitHub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version that npm already published
        required: true
        type: string

concurrency:
  group: recover-github-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      tarball: ${{ steps.release.outputs.tarball }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - id: release
        name: Verify the published package and release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
            import { isReleaseVersion } from "./scripts/check-release-artifact.mjs";
            if (!isReleaseVersion(process.env.VERSION)) throw new Error("version is not valid SemVer");
          '
          tag="v${VERSION}"
          git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
          commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          package_name="$(node -p "require('./package.json').name")"
          npm pack "${package_name}@${VERSION}" \
            --json \
            --ignore-scripts \
            --pack-destination="$RUNNER_TEMP" > "$RUNNER_TEMP/npm-pack.json"
          tarball="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parseNpmPackJson } from "./scripts/parse-npm-pack.mjs";
            process.stdout.write(parseNpmPackJson(readFileSync(process.argv[1], "utf8")).filename);
          ' "$RUNNER_TEMP/npm-pack.json")"
          oidc_subject="$(node -p "require('./scripts/release-governance.json').npmTrustedPublisher.oidcSubject")"
          node scripts/verify-published-package.mjs \
            --tarball "$RUNNER_TEMP/$tarball" \
            --version "$VERSION" \
            --repository "https://github.com/${GITHUB_REPOSITORY}" \
            --workflow ".github/workflows/release.yml" \
            --environment release \
            --ref "refs/tags/${tag}" \
            --commit "$commit" \
            --oidc-subject "$oidc_subject"
          {
            echo "commit=$commit"
            echo "tag=$tag"
            echo "tarball=$tarball"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-tarball
          path: ${{ runner.temp }}/${{ steps.release.outputs.tarball }}
          if-no-files-found: error

  recover:
    timeout-minutes: 20
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovery-tarball
          path: .
      - name: Create or verify the GitHub release
        env:
          COMMIT: ${{ needs.verify.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node scripts/create-github-release.mjs \
            --tag "$TAG" \
            --version "$VERSION" \
            --expected-commit "$COMMIT" \
            --tarball "./$TARBALL"
