version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned to the engines floor line: newer type majors let code
      # type-check against Node APIs the supported floor does not provide
      # (FINDINGS.md OPS-011). Raise together with engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      oxc:
        patterns:
          - "@oxlint/*"
          - "oxc-parser"
          - "oxlint"
          - "oxfmt"
      dev-toolchain:
        patterns:
          - "typescript"
          - "tsx"
          - "@types/*"
          - "eslint"
