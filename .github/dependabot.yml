version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      oxc:
        patterns:
          - "@oxlint/*"
          - "oxc-parser"
          - "oxlint"
          - "oxfmt"
      dev-toolchain:
        patterns:
          - "typescript"
          - "tsx"
          - "@types/*"
          - "eslint"
